    <style>
        /* ==========================================
            GLOBAL RESETS & VIEWPORT LOCK
            ========================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Locks outer window to prevent scroll conflicts */
            font-family: Arial, Helvetica, sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: var(--color_base);
            color: var(--text_base);
        }

        img, video, picture, svg {
            max-width: 100%;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul, ol {
            list-style: none;
        }

        /* ==========================================
            SNAP CONTAINER & SECTIONS
            ========================================== */
        .index_page_container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .snap_container {
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .section {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Make Page 3 use normal scrolling (removes snap restriction and fixed height overflow) */
        .section#3 {
            scroll-snap-align: none !important;
            scroll-snap-stop: normal !important;
            height: auto !important;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-y: visible !important;
            justify-content: flex-start;
        }

        .footer {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* ==========================================
            FORM DISABLED / "DISHILITED" STATE STYLING
            ========================================== */
        .form_control:disabled {
            background-color: #121418 !important;
            color: #555c68 !important;
            border-color: #1f232b !important;
            cursor: not-allowed;
        }

        .form_group.faded_group .form_label {
            color: #555c68 !important;
        }
    </style>
</head>

<body class="body_player page_about" data-page="about">
    <div class="index_page_container">
        <!-- NAVIGATION BAR CONTAINER -->
        <div id="nav_container"></div>

        <!-- SNAP SECTIONS FOR ABOUT PAGES -->
        <div class="snap_container" id="snapContainer">
            <div class="nav_link section" id="1"></div>
            <div class="nav_link section" id="2"></div>
            <div class="nav_link section" id="3"></div>
            <div class="footer" id="4"></div>
        </div>
    </div>

    <!-- ==========================================
         SCRIPT 1: ABOUT CONTENT LOADER & FORM OBSERVER
         ========================================== -->
    <script>
        const pagesToLoad = [
            { file: 'about/aboutpage1.html', targetId: '1' },
            { file: 'about/aboutpage2.html', targetId: '2' },
            { file: 'about/aboutpage3.html', targetId: '3' },
            { file: 'home/homepage4.html', targetId: '4' }
        ];

        async function loadWebsite() {
            for (let page of pagesToLoad) {
                let sectionDiv = document.getElementById(page.targetId);
                if (!sectionDiv) continue;

                try {
                    let response = await fetch(page.file);
                    let htmlText = await response.text();

                    let parser = new DOMParser();
                    let doc = parser.parseFromString(htmlText, 'text/html');

                    doc.querySelectorAll('style').forEach(style => {
                        document.head.appendChild(style);
                    });

                    sectionDiv.innerHTML = doc.body.innerHTML;

                    doc.querySelectorAll('script').forEach(oldScript => {
                        let newScript = document.createElement('script');
                        newScript.text = oldScript.text;
                        document.body.appendChild(newScript);
                    });

                } catch (error) {
                    console.error('Error loading page:', page.file, error);
                }
            }

            initVocalFormToggle();
        }

        loadWebsite();
    </script>

    <!-- ==========================================
         SCRIPT 2: INQUIRY TYPE FORM TOGGLE LOGIC
         ========================================== -->
    <script>
        function initVocalFormToggle() {
            const inquirySelect = document.getElementById('inquiry_type');
            if (!inquirySelect) return;
            
            const genreGroup = document.getElementById('genre_group');
            const genreSelect = document.getElementById('genre_select');
            const genreLabel = document.getElementById('genre_label');
            
            const musicDetailsRow = document.getElementById('music_details_row');
            const bpmInput = document.getElementById('bpm_input');
            const refInput = document.getElementById('ref_input');
            
            const linkGroup = document.getElementById('link_group');
            const linkInput = document.getElementById('link_input');
            const linkLabel = document.getElementById('link_label');

            function updateFormFields() {
                const selected = inquirySelect.value;

                if (selected === 'Vocal Submission') {
                    setActive(genreGroup, genreSelect, true);
                    if (genreLabel) genreLabel.innerHTML = 'Preferred Genre / Vibe *';

                    if (musicDetailsRow) musicDetailsRow.style.opacity = '1';
                    if (bpmInput) bpmInput.disabled = false;
                    if (refInput) refInput.disabled = false;

                    setActive(linkGroup, linkInput, true);
                    if (linkInput) linkInput.required = true;
                    if (linkLabel) linkLabel.innerHTML = 'Direct Audio Link (Google Drive, Dropbox, WeTransfer, SoundCloud) *';

                } else if (selected === 'Collaboration') {
                    setActive(genreGroup, genreSelect, false);
                    if (genreLabel) genreLabel.innerHTML = 'Preferred Genre / Vibe <span class="optional_text">(Optional)</span>';

                    if (musicDetailsRow) musicDetailsRow.style.opacity = '1';
                    if (bpmInput) bpmInput.disabled = false;
                    if (refInput) refInput.disabled = false;

                    setActive(linkGroup, linkInput, false);
                    if (linkInput) linkInput.required = false;
                    if (linkLabel) linkLabel.innerHTML = 'Direct Audio Link <span class="optional_text">(Optional)</span>';

                } else {
                    setDisabled(genreGroup, genreSelect);
                    if (genreLabel) genreLabel.innerHTML = 'Preferred Genre / Vibe <span class="optional_text">(Disabled)</span>';

                    if (musicDetailsRow) musicDetailsRow.style.opacity = '0.35';
                    if (bpmInput) { bpmInput.disabled = true; bpmInput.value = ''; }
                    if (refInput) { refInput.disabled = true; refInput.value = ''; }

                    setDisabled(linkGroup, linkInput);
                    if (linkInput) linkInput.required = false;
                    if (linkLabel) linkLabel.innerHTML = 'Direct Audio Link <span class="optional_text">(Disabled)</span>';
                }
            }

            function setActive(group, input, isRequired) {
                if (!group || !input) return;
                group.classList.remove('faded_group');
                group.style.opacity = '1';
                input.disabled = false;
                input.required = isRequired;
            }

            function setDisabled(group, input) {
                if (!group || !input) return;
                group.classList.add('faded_group');
                group.style.opacity = '0.4';
                input.disabled = true;
                input.value = ''; 
                input.required = false;
            }

            inquirySelect.removeEventListener('change', updateFormFields);
            inquirySelect.addEventListener('change', updateFormFields);
            updateFormFields();
        }
    </script>

    <!-- ==========================================
         SCRIPT 3: NAVBAR FETCH, MOBILE MENU & SCROLL SPY SCRIPT
         ========================================== -->
    <script>
        async function loadNavbar() {
            try {
                let navRes = await fetch('../nav.html');
                let navText = await navRes.text();
                document.getElementById('nav_container').innerHTML = navText;

                initMobileMenu();
                initNavbarInteractions();
                initScrollSpy();
            } catch (err) {
                console.error('Error loading navigation:', err);
            }
        }

        function initMobileMenu() {
            const mobileToggleBtn = document.getElementById('mobileToggle');
            const mobileMenuOverlay = document.getElementById('mobileMenu');

            if (mobileToggleBtn && mobileMenuOverlay) {
                mobileToggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    mobileMenuOverlay.classList.toggle('open');
                    
                    const icon = mobileToggleBtn.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-bars');
                        icon.classList.toggle('fa-xmark');
                    }
                });
            }
        }

        function initNavbarInteractions() {
            const snapContainerElement = document.getElementById('snapContainer');
            const activeGroup = document.querySelector('.nav_expandable_group:not([style*="display: none"])');
            const expandBtn = activeGroup ? activeGroup.querySelector('.expand_trigger') : null;

            if (snapContainerElement && activeGroup) {
                snapContainerElement.addEventListener('scroll', function() {
                    if (snapContainerElement.scrollTop > 50) {
                        activeGroup.classList.add('scrolled_expand');
                    } else {
                        activeGroup.classList.remove('scrolled_expand');
                    }
                });
            }

            if (expandBtn && activeGroup) {
                expandBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    activeGroup.classList.toggle('scrolled_expand');
                });
            }
        }

        function initScrollSpy() {
            const snapContainer = document.getElementById('snapContainer');
            const sections = snapContainer.querySelectorAll('.section');

            function updateActiveLinks() {
                let current = '1'; 
                const scrollPos = snapContainer.scrollTop;

                if (scrollPos > 10) {
                    sections.forEach(section => {
                        const sectionTop = section.offsetTop - 150;
                        const sectionHeight = section.clientHeight;
                        if (scrollPos >= sectionTop && scrollPos < sectionTop + sectionHeight) {
                            current = section.getAttribute('id');
                        }
                    });
                }

                const links = document.querySelectorAll('.nav_link, .sub_item, .sub_nav_link');
                links.forEach(link => {
                    link.classList.remove('active');
                    const href = link.getAttribute('href') || '';
                    if (href === '#' + current) {
                        link.classList.add('active');
                    }
                });
            }

            updateActiveLinks();
            setTimeout(updateActiveLinks, 100);
            setTimeout(updateActiveLinks, 300);

            snapContainer.addEventListener('scroll', updateActiveLinks);
        }

        loadNavbar();
    </script>

    <!-- ==========================================
         SCRIPT 4: MOUSE WHEEL SNAP-SCROLLING CONTROLLER (BYPASSES PAGE 3)
         ========================================== -->
   

    <script>
    // Stop Chrome from trying to restore old scroll positions
    if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
    }

    // Force the window back to the top immediately, and once more after fetch finishes
    window.scrollTo(0, 0);
    window.addEventListener('load', function() {
        setTimeout(function() {
            window.scrollTo(0, 0);
        }, 50); // Small 50ms delay lets your fetch content settle first
    });
</script>
