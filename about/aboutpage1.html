<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producer Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
    <script type="js/nav.js"></script>


    <style>


        .body_about1 {
            margin: 0;
            background-color: #0a0914;
            color: #f3f4f6;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Hero Banner Component */
        .hero {
            position: relative;
            width: 100%;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .hero img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            padding: 0 1rem;
            max-width: 600px;
        }

        .hero span {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a78bfa;
            display: block;
            margin-bottom: 0.5rem;
        }

        .hero h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin: 0 0 1rem 0;
            color: #fff;
            line-height: 1.2;
        }

        .hero a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #7c3aed;
            color: #fff;
            text-decoration: none;
            border-radius: 9999px;
            font-weight: bold;
            font-size: 0.875rem;
            transition: background 0.2s;
        }

        .hero a:hover {
            background-color: #6d28d9;
        }
    </style>
</head>
<body class="body_about1">

    <!-- HERO BANNER PAGE MODULE -->
    <section class="hero">
        <img src="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=1920&auto=format&fit=crop" alt="Studio">
        <div class="hero-content">
            <span>Zero-Risk Vocal Demo Process</span>
            <h1>Helping singers start their first song or release their next one</h1>
            <a href="#send-vocal">Test Your Vocal For Free <i class="fa-solid fa-arrow-right"></i></a>
        </div>
    </section>

</body>
</html>
