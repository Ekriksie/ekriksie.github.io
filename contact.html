<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y0D4WSLZGN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-Y0D4WSLZGN');
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ékriksie | Contact Hub</title>
    <!-- Link Global Theme Configuration -->
    <link rel="stylesheet" href="theme.css">

    <script>
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav_placeholder').innerHTML = data;
            });
    </script>

        <!-- Navaction active-->
    <style type="text/css">
        .nav_contact{
            color: var(--int_nav_active) !important;  }


            .mini_nav_contact 
            { display: flex !important;
        }



    </style>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow-x: hidden; font-family: Arial, sans-serif; background-color: var(--bg_canvas); color: var(--text_main); }
        .page_wrapper { display: flex; flex-direction: column; width: 100%; min-height: 100vh; }
        .contact_page_content { display: flex; flex-direction: column; width: 100%; min-height: 100vh; padding-top: 20px; }
        .contact_section { width: 100%; background-color: var(--bg_canvas); padding: 50px 5% 80px 5%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .section_header { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
        .section_title { font-size: 40px; font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; color: var(--text_main); }
        .section_subtitle { color: var(--text_muted); font-size: 1rem; letter-spacing: 1px; max-width: 500px; line-height: 1.5; margin-bottom: 15px; }
        
        /* Header Social Media Button Styling */
        .header_social_btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--int_default);
            color: var(--text_main);
            padding: 10px 20px;
            border: 1px solid var(--border_subtle);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: background-color var(--transition_speed), transform 0.2s, border-color var(--transition_speed);
        }
        .header_social_btn:hover {
            background-color: var(--int_hover);
            border-color: var(--int_hover);
            transform: translateY(-2px);
        }

        .contact_card { width: 100%; max-width: 600px; background-color: var(--bg_surface); border: 1px solid var(--border_subtle); border-radius: 12px; box-shadow: 0 10px 25px var(--shadow_subtle); padding: 40px; display: flex; flex-direction: column; gap: 20px; }
        .form_group { display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; }
        .form_label { font-size: 0.9rem; font-weight: bold; color: var(--text_muted); letter-spacing: 0.5px; }
        .form_input, .form_textarea, .form_select { width: 100%; background-color: var(--bg_container); border: 1px solid var(--border_subtle); border-radius: 8px; padding: 12px 15px; color: var(--text_main); font-size: 1rem; font-family: Arial, sans-serif; outline: none; transition: border-color var(--transition_speed); }
        .form_input:focus, .form_textarea:focus, .form_select:focus { border-color: var(--int_hover); }
        .form_textarea { resize: vertical; min-height: 120px; }
        .contact_btn { background-color: var(--accent_primary); color: var(--text_main); padding: 14px 32px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; letter-spacing: 1px; cursor: pointer; transition: background-color var(--transition_speed), transform 0.2s; width: 100%; margin-top: 5px; }
        .contact_btn:hover { background-color: var(--text_hover); transform: translateY(-2px); }
        .divider { width: 100%; height: 1px; background-color: var(--border_subtle); margin: 5px 0; }
        .social_section_title { font-size: 1rem; font-weight: bold; color: var(--text_main); letter-spacing: 0.5px; text-align: center; }
        
        .social_buttons_grid { 
            display: flex; 
            flex-direction: row; 
            gap: 12px; 
            width: 100%; 
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .social_btn { 
            background-color: var(--int_default); 
            width: 46px;
            height: 46px;
            border-radius: 8px; 
            text-decoration: none; 
            border: 1px solid var(--border_subtle); 
            transition: background-color var(--transition_speed), transform 0.2s, border-color var(--transition_speed); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        /* Unified Hover State using Theme Variables */
        .social_btn:hover { 
            background-color: var(--int_hover); 
            border-color: var(--int_hover); 
            transform: translateY(-2px); 
        }

        .social_icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Forces the icons to look white via CSS filter */
        .social_icon img {
            width: 22px;
            height: 22px;
            display: block;
            object-fit: contain;
            
        }

        @media (max-width: 600px) { .contact_card { padding: 30px 20px; } }
    </style>
</head>
<body>

<div class="nav_placeholder" id="nav_placeholder"></div>

<div class="page_wrapper">
    <div class="contact_page_content">
        
        <div class="contact_section">
            
            <div class="section_header">
                <h1 class="section_title">Get in Touch</h1>
                <p class="section_subtitle">Select an inquiry type and send a message directly to my inbox.</p>
                <!-- Added Social Media Button under subtitle -->
                <a href="contact/media.html" class="header_social_btn">Social Media</a>
            </div>

            <div class="contact_card">
                
                <form action="https://formsubmit.co/ekriksie@gmail.com" method="POST">
                    
                    <input type="hidden" name="_subject" value="New Inquiry from Ékriksie Website!">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" value="thankyou.html">

                    <div class="form_group" style="margin-bottom: 15px;">
                        <label class="form_label">Inquiry Type</label>
                        <select name="Inquiry_Type" class="form_select" required>
                            <option value="" disabled selected>Select what you need...</option>
                            <option value="Custom Beat">Custom Beat</option>
                            <option value="Art Commission">Art Commission</option>
                            <option value="Licensing Question">Licensing Question</option>
                            <option value="General Question">General Question</option>
                        </select>
                    </div>

                    <div class="form_group" style="margin-bottom: 15px;">
                        <label class="form_label">Your Email</label>
                        <input type="email" name="email" class="form_input" placeholder="name@example.com" required>
                    </div>

                    <div class="form_group" style="margin-bottom: 20px;">
                        <label class="form_label">Your Message</label>
                        <textarea name="message" class="form_textarea" placeholder="Write your details or questions here..." required></textarea>
                    </div>

                    <button type="submit" class="contact_btn">Send Message</button>
                </form>

                <div class="divider"></div>

                <div class="social_section_title">Or Connect via Social Media</div>
                
                <div class="social_buttons_grid">
                    <a href="https://pixabay.com/users/ekriksiemusic-27798937/" target="_blank" class="social_btn" title="Pixabay">
                        <span class="social_icon"><img src="images/icons/pixabay.png" alt="Pixabay"></span>
                    </a>
                    <a href="https://x.com/EkriksieMusic" target="_blank" class="social_btn" title="X">
                        <span class="social_icon"><img src="images/icons/x.png" alt="X"></span>
                    </a>
                    <a href="https://www.instagram.com/EkriksieMusic" target="_blank" class="social_btn" title="Instagram">
                        <span class="social_icon"><img src="images/icons/instagram.png" alt="Instagram"></span>
                    </a>
                    <a href="https://www.patreon.com/cw/EkriksieMusic" target="_blank" class="social_btn" title="Patreon">
                        <span class="social_icon"><img src="images/icons/patreon.png" alt="Patreon"></span>
                    </a>
                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
