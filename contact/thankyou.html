<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ékriksie | Message Sent</title>
    <!-- Link Global Theme Configuration -->
    <link rel="stylesheet" href="../theme.css">
    <style>
        :root {
            --accent_glow: rgba(192, 132, 252, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: Arial, sans-serif; 
            background-color: var(--bg_canvas); 
            color: var(--text_main); 
        }
        .thankyou_card { 
            background-color: var(--bg_surface); 
            padding: 45px 35px; 
            border-radius: 14px; 
            text-align: center; 
            max-width: 520px; 
            width: 90%; 
            box-shadow: 0 10px 30px var(--shadow_subtle), 0 0 20px var(--accent_glow); 
            border: 1px solid var(--border_subtle);
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
            animation: fadeInCard 0.6s ease-out;
        }
        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 { font-size: 28px; font-weight: 900; color: var(--text_accent); letter-spacing: 0.5px; }
        p { color: var(--text_muted); font-size: 0.95rem; line-height: 1.6; }
        p strong { color: var(--text_main); font-weight: 600; }
        .btn_group { display: flex; gap: 12px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .action_btn { display: inline-block; background-color: var(--accent_primary); color: var(--text_main); padding: 12px 22px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: background-color var(--transition_speed), transform 0.2s; }
        .action_btn:hover { background-color: var(--text_hover); transform: translateY(-2px); }
        .action_btn.secondary { background-color: transparent; border: 1px solid var(--border_subtle); color: var(--text_muted); }
        .action_btn.secondary:hover { background-color: rgba(255,255,255,0.05); color: var(--text_main); border-color: var(--text_muted); }
    </style>
</head>
<body>

<div class="thankyou_card">
    <h1>Message Received!</h1>
    <p>Thank you for reaching out. Your note has landed securely in my inbox, and I will get back to you <strong>within 24 hours</strong>[cite: 2].</p>
    <p style="font-size: 0.85rem;">If it takes longer than that, please feel free to resend your message or catch me directly on social media.</p>
    <div class="btn_group">
        <a href="../index.html" class="action_btn">Return to Home</a>
        <a href="../contact/media.html" target="_blank" class="action_btn secondary">Check Socials</a>
    </div>
</div>

</body>
</html>
