<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ÉKRIKSIE</title>
    <!-- Link Global Theme Configuration -->
    <link rel="stylesheet" href="../theme.css">

    <style>
        /* Combined main section container */
        .home_page_container {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
            background-color: var(--bg_canvas);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .home_page_container *, 
        .home_page_container *::before, 
        .home_page_container *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Logo Banner */
        .home_logo_banner {
            width: 100%;
            height: 15vh;
            background-color: var(--bg_container);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--border_subtle);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .home_banner_logo {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            color: var(--text_main);
            user-select: none;
            text-transform: uppercase;
        }

        /* Side-by-Side Cards Container */
        .home_cards_container {
            width: 100%;
            height: 85vh;
            display: flex;
            flex-direction: row;
        }

        /* Individual Cards */
        .home_feature_card {
            position: relative;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            transition: transform 0.5s ease;
        }

        /* Subtle dividing border between the two cards */
        .home_cards_container .home_feature_card:first-child {
            border-right: 1px solid var(--bg_surface);
        }

        /* Dark overlay for text readability over photos */
        .home_feature_card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 18, 0.75);
            z-index: 1;
            transition: background var(--transition_speed);
        }

        .home_feature_card:hover::before {
            background: rgba(18, 18, 18, 0.6);
        }

        .home_card_content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 450px;
            padding: 20px;
        }

        /* Background Images */
        .home_custom_beat_card {
            background-image: url('images/mic.jpg');
        }

        .home_buy_beat_card {
            background-image: url('images/mixer.jpg');
        }

        /* Typography */
        .home_card_title {
            color: var(--text_main);
            font-size: clamp(2rem, 3.5vw, 3rem);
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .home_card_subtitle {
            color: var(--text_main);
            font-size: clamp(1rem, 1.5vw, 1.25rem);
            font-weight: 500;
            margin-bottom: 30px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            line-height: 1.4;
        }

        .home_card_btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 40px;
            background-color: var(--accent_primary);
            color: var(--text_main);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-radius: 20px;
            transition: background-color var(--transition_speed), transform var(--transition_speed), box-shadow var(--transition_speed);
            text-transform: uppercase;
        }

        .home_card_btn:hover {
            background-color: var(--interactive_hover);
            transform: translateY(-3px);
        }

        /* RESPONSIVE: Stack on mobile screens */
        @media (max-width: 768px) {
            .home_logo_banner {
                height: 12vh;
            }
            .home_cards_container {
                flex-direction: column;
                height: auto;
            }
            .home_cards_container .home_feature_card:first-child {
                border-right: none;
                border-bottom: 1px solid var(--border_subtle);
            }
            .home_feature_card {
                width: 100%;
                height: 44vh;
            }
        }
    </style>
</head>
<body>

<section class="home_page_container">
    
    <!-- Logo Banner -->
    <div class="home_logo_banner">
        <div class="home_banner_logo">EKRIKSIE</div>
    </div>
    
    <!-- Side-by-Side Cards Container -->
    <div class="home_cards_container">
        
        <!-- Left Card -->
        <div class="home_feature_card home_custom_beat_card">
            <div class="home_card_content">
                <h2 class="home_card_title">Custom Beat</h2>
                <p class="home_card_subtitle">Make your sound truly unique with custom production</p>
                <a href="music/custombeats.html" class="home_card_btn">Free Trial</a>
            </div>
        </div>

        <!-- Right Card -->
        <div class="home_feature_card home_buy_beat_card">
            <div class="home_card_content">
                <h2 class="home_card_title">Free Beats</h2>
                <p class="home_card_subtitle">Explore high-quality ready-to-use professional beats</p>
                <a href="gallery/freebeats.html" class="home_card_btn">Visit Gallery</a>
            </div>
        </div>

    </div>

</section>

</body>


</html>
